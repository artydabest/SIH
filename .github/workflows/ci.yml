name: CI

on:
  push:
    branches: [main, clean-main]
  pull_request:

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disaster-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: disaster-relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:confidence
      - run: npm run test:shelter

  dashboard:
    name: Dashboard — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emergency-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emergency-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
