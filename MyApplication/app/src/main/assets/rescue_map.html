<!DOCTYPE html>
<!--
  Rescue Map — standalone HTML port of emergency-dashboard/src/components/RescueMap.tsx
  Built for Android Studio: drop this into app/src/main/assets/ and load it in a WebView.

  Usage from Android:
    webView.settings.javaScriptEnabled = true
    webView.loadUrl("file:///android_asset/rescue_map.html")

  To push live data into the map (optional):
    webView.evaluateJavascript("window.loadEmergencies($json)") { }
  where $json is the JSON array of emergencies (same shape as the Emergency type).
  Without data it renders the demo emergencies below.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rescue Map</title>

  <!-- Leaflet (pinned versions; loads from CDN — device needs internet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --radius: 12px;
      --radius-sm: 8px;
      --surface: #141518;
      --surface-2: #1b1d21;
      --border: #2a2d33;
      --border-strong: #3a3e45;
      --text: #f2f3f5;
      --text-2: #c3c7cd;
      --muted: #8b9098;
      --red: #ff3b30;
      --blue: #0a84ff;
      --yellow: #ffd60a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--surface);
      font-family: -apple-system, "Roboto", "Segoe UI", sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .rescue-map { position: relative; height: 100vh; width: 100vw; }

    .rescue-map__canvas {
      height: 100%;
      width: 100%;
      background-color: var(--surface-2);
    }

    /*
     * Full-detail OSM tiles, inverted to dark. invert(1) flips the palette,
     * hue-rotate(180deg) restores natural hues (water blue, parks green), and
     * the brightness/contrast trim keeps it in line with the ops theme.
     * Markers and popups live outside .osm-dark-tiles, so they are unaffected.
     */
    .osm-dark-tiles {
      filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.92) saturate(0.7);
    }

    .leaflet-container {
      background-color: var(--surface-2);
      font-family: inherit;
    }

    .leaflet-control-zoom a {
      background-color: var(--surface-2) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background-color: var(--surface) !important; }

    .leaflet-control-attribution {
      background-color: rgba(9, 10, 12, 0.75) !important;
      color: var(--muted) !important;
      font-size: 9px !important;
    }
    .leaflet-control-attribution a { color: var(--text-2) !important; }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background-color: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-strong);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .leaflet-popup-content { margin: 0.6rem 0.75rem; font-size: 0.78rem; }
    .leaflet-popup-close-button { color: var(--muted) !important; }

    /* Markers */
    .map-marker { background: transparent; border: none; }

    .map-marker__emergency {
      display: block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--marker-color, var(--red));
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px var(--marker-color, var(--red));
    }
    .map-marker__emergency--pulse { animation: marker-pulse 2.2s ease-out infinite; }

    @keyframes marker-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.55); }
      70%  { box-shadow: 0 0 0 12px rgba(255, 59, 48, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    .map-marker__relay {
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--blue);
      border: 1.5px solid #ffffff;
      opacity: 0.9;
    }

    .map-marker__responder {
      display: block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      transform: rotate(45deg);
      background-color: #9b59f6;
      border: 2px solid #ffffff;
    }

    /* Legend */
    .map-legend {
      position: absolute;
      left: 0.6rem;
      bottom: 0.9rem;
      z-index: 500;
      display: flex;
      gap: 0.8rem;
      background-color: rgba(9, 10, 12, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.35rem 0.65rem;
      font-size: 0.64rem;
      color: var(--text-2);
    }
    .map-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
    .map-legend--confidence { bottom: 3.1rem; gap: 0.6rem; }
    .map-legend__title {
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-size: 0.58rem;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .legend-dot--emergency { background-color: var(--red); }
    .legend-dot--relay { background-color: var(--blue); }
    .legend-dot--responder { background-color: #9b59f6; border-radius: 2px; }

    /* Popups */
    .map-popup { display: flex; flex-direction: column; gap: 0.15rem; min-width: 150px; }
    .map-popup strong { font-size: 0.8rem; }
    .map-popup span { color: var(--text-2); font-size: 0.72rem; }
    .map-popup .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .map-popup__demo {
      color: var(--yellow) !important;
      font-size: 0.6rem !important;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="rescue-map">
    <div id="map" class="rescue-map__canvas"></div>

    <div class="map-legend" aria-hidden="true">
      <span><i class="legend-dot legend-dot--emergency"></i> Emergency</span>
      <span><i class="legend-dot legend-dot--relay"></i> Relay device</span>
      <span><i class="legend-dot legend-dot--responder"></i> Responder</span>
    </div>
    <div class="map-legend map-legend--confidence" aria-hidden="true">
      <span class="map-legend__title">CONFIDENCE</span>
      <span><i class="legend-dot" style="background:#30d158"></i> Low</span>
      <span><i class="legend-dot" style="background:#ffd60a"></i> Medium</span>
      <span><i class="legend-dot" style="background:#ff9f0a"></i> High</span>
      <span><i class="legend-dot" style="background:#ff3b30"></i> Critical</span>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────
    // Marker color rule (from the integration brief):
    // confidence level when the backend provides it, status otherwise.
    // ─────────────────────────────────────────────────────────────
    var CONFIDENCE_COLOR = {
      LOW: "#30d158",
      MEDIUM: "#ffd60a",
      HIGH: "#ff9f0a",
      CRITICAL: "#ff3b30"
    };

    var EMERGENCY_COLOR = {
      NEW: "#ff3b30",
      ACKNOWLEDGED: "#ff9f0a",
      RESPONDING: "#0a84ff",
      RESOLVED: "#30d158"
    };

    function markerColor(emergency) {
      return emergency.confidenceLevel != null
        ? CONFIDENCE_COLOR[emergency.confidenceLevel]
        : EMERGENCY_COLOR[emergency.status];
    }

    /*
     * Relay devices are simulated around each emergency (the backend does not
     * provide them) and are labeled as such in popups. Offsets are stable per
     * device, derived from the emergency id.
     */
    function relayOffsets(emergency) {
      var jitter = (emergency._id.charCodeAt(0) % 5) + 3;
      var d = jitter * 0.0016;
      return [
        [emergency.latitude + d, emergency.longitude - d * 0.7],
        [emergency.latitude - d * 0.6, emergency.longitude + d],
        [emergency.latitude + d * 0.3, emergency.longitude + d * 0.9]
      ];
    }

    // ─────────────────────────────────────────────────────────────
    // Formatting helpers (ported from src/lib/format.ts)
    // ─────────────────────────────────────────────────────────────
    function formatCoords(lat, lon, digits) {
      digits = digits == null ? 4 : digits;
      return lat.toFixed(digits) + ", " + lon.toFixed(digits);
    }

    function formatRelative(iso) {
      var then = new Date(iso).getTime();
      if (isNaN(then)) return "unknown";
      var seconds = Math.max(0, Math.round((Date.now() - then) / 1000));
      if (seconds < 5) return "just now";
      if (seconds < 60) return seconds + " sec ago";
      var minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + " min ago";
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + " h " + (minutes % 60) + " min ago";
      return Math.floor(hours / 24) + " d ago";
    }

    // ─────────────────────────────────────────────────────────────
    // Marker icons
    // ─────────────────────────────────────────────────────────────
    function emergencyIcon(emergency) {
      var color = markerColor(emergency);
      var pulse =
        emergency.status === "NEW" || emergency.confidenceLevel === "CRITICAL";
      return L.divIcon({
        className: "map-marker",
        html:
          '<span class="map-marker__emergency ' +
          (pulse ? "map-marker__emergency--pulse" : "") +
          '" style="--marker-color:' + color + '"></span>',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
        popupAnchor: [0, -12]
      });
    }

    var relayIcon = L.divIcon({
      className: "map-marker",
      html: '<span class="map-marker__relay"></span>',
      iconSize: [12, 12],
      iconAnchor: [6, 6],
      popupAnchor: [0, -8]
    });

    var responderIcon = L.divIcon({
      className: "map-marker",
      html: '<span class="map-marker__responder"></span>',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
      popupAnchor: [0, -8]
    });

    // ─────────────────────────────────────────────────────────────
    // Demo data (same shape as the backend Emergency type).
    // Replaced by window.loadEmergencies(...) when Android pushes JSON.
    // ─────────────────────────────────────────────────────────────
    var DEMO_EMERGENCIES = [
      {
        _id: "a1", deviceId: "DEV-101", latitude: 12.9716, longitude: 77.5946,
        status: "NEW", confidence: 92, confidenceLevel: "CRITICAL",
        createdAt: new Date(Date.now() - 40000).toISOString()
      },
      {
        _id: "b2", deviceId: "DEV-102", latitude: 12.9580, longitude: 77.6150,
        status: "ACKNOWLEDGED", confidence: 64, confidenceLevel: "HIGH",
        createdAt: new Date(Date.now() - 300000).toISOString()
      },
      {
        _id: "c3", deviceId: "DEV-103", latitude: 12.9862, longitude: 77.6085,
        status: "RESPONDING", confidence: 38, confidenceLevel: "MEDIUM",
        createdAt: new Date(Date.now() - 900000).toISOString()
      },
      {
        _id: "d4", deviceId: "DEV-104", latitude: 12.9640, longitude: 77.5780,
        status: "RESOLVED",
        createdAt: new Date(Date.now() - 3600000).toISOString()
      }
    ];

    var DEFAULT_CENTER = [12.9716, 77.5946];
    var emergencies = DEMO_EMERGENCIES;

    var map = L.map("map", {
      center: emergencies.length > 0
        ? [emergencies[0].latitude, emergencies[0].longitude]
        : DEFAULT_CENTER,
      zoom: emergencies.length > 0 ? 12 : 13,
      scrollWheelZoom: true
    });

    // Full-detail OpenStreetMap tiles, rendered dark via CSS inversion
    // (see .osm-dark-tiles above).
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      className: "osm-dark-tiles",
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var markerLayer = L.layerGroup().addTo(map);

    function popupHtml(lines) {
      return '<div class="map-popup">' + lines.join("") + "</div>";
    }

    function renderEmergencies() {
      markerLayer.clearLayers();

      emergencies.forEach(function (emergency) {
        var isActive = emergency.status !== "RESOLVED";

        var popupLines = [
          "<strong>Device #" + emergency.deviceId + "</strong>"
        ];
        if (emergency.confidence != null) {
          popupLines.push(
            "<span>Confidence: " + emergency.confidence + "%" +
            (emergency.confidenceLevel ? " (" + emergency.confidenceLevel + ")" : "") +
            "</span>"
          );
        }
        popupLines.push("<span>Status: " + emergency.status + "</span>");
        popupLines.push("<span>Detected " + formatRelative(emergency.createdAt) + "</span>");
        popupLines.push(
          '<span class="mono">' +
          formatCoords(emergency.latitude, emergency.longitude) +
          "</span>"
        );

        L.marker([emergency.latitude, emergency.longitude], {
          icon: emergencyIcon(emergency)
        })
          .bindPopup(popupHtml(popupLines))
          .addTo(markerLayer);

        if (isActive) {
          relayOffsets(emergency).forEach(function (position, index) {
            L.marker(position, { icon: relayIcon })
              .bindPopup(
                popupHtml([
                  "<strong>Relay device " + (index + 1) + "</strong>",
                  '<span class="map-popup__demo">SIMULATED &mdash; nearby iPhone relay</span>',
                  "<span>Detected emergency beacon</span>"
                ])
              )
              .addTo(markerLayer);
          });
        }
      });

      // Responder unit (simulated position).
      L.marker([12.9698, 77.6178], { icon: responderIcon })
        .bindPopup(
          popupHtml([
            "<strong>Responder Unit 1</strong>",
            '<span class="map-popup__demo">SIMULATED position</span>'
          ])
        )
        .addTo(markerLayer);

      // Fit all emergencies into view (mirrors the MapFocus behavior).
      if (emergencies.length > 0) {
        var bounds = L.latLngBounds(
          emergencies.map(function (e) {
            return [e.latitude, e.longitude];
          })
        );
        map.fitBounds(bounds, { padding: [45, 45], maxZoom: 15 });
      }
    }

    renderEmergencies();

    // ─────────────────────────────────────────────────────────────
    // Bridge for Android: push fresh data from Kotlin/Java via
    // webView.evaluateJavascript("window.loadEmergencies(<json array>)").
    // Optionally pass a selectedId to fly to one emergency.
    // ─────────────────────────────────────────────────────────────
    window.loadEmergencies = function (data, selectedId) {
      if (!Array.isArray(data)) return;
      emergencies = data;
      renderEmergencies();

      var selected = null;
      for (var i = 0; i < emergencies.length; i++) {
        if (emergencies[i]._id === selectedId) { selected = emergencies[i]; break; }
      }
      if (selected) {
        map.flyTo([selected.latitude, selected.longitude], 15, { duration: 0.8 });
      }
    };
  </script>
</body>
</html>
